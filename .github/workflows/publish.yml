name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # release-please owns versioning: it reads Conventional Commits on main,
  # keeps the release PR (package.json + CHANGELOG.md) up to date and, on
  # merge, cuts the vX.Y.Z tag and GitHub release (see release-please-config.json).
  # The release GitHub App token makes the release PR trigger the CI workflow.
  release:
    uses: middag-io/actions/.github/workflows/release-please.yml@release-please-v1
    # contents: read only checks out the release-please configuration; every
    # write (release PR, tag, release) uses the release GitHub App token.
    permissions:
      contents: read
    with:
      app-client-id: ${{ vars.GH_APPS_MIDDAG_CI_RELEASE_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.GH_APPS_MIDDAG_CI_RELEASE_PRIVATE_KEY }}

  publish:
    name: Publish @middag-io/react
    needs: release
    # workflow_dispatch keeps a manual heal path: every publish step below is
    # idempotent (skips when the version is already on the registry), so a
    # partially failed publish can be re-run without a new release.
    if: ${{ needs.release.outputs.release-created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # OIDC for npm Trusted Publishing (public npm channel). This repository
      # is public, so npm also generates provenance/attestation automatically.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      # Trusted publishing needs npm >= 11.5.2 (OIDC detection fixes). Node 24
      # bundles a recent npm, but the exact 24.x is resolved at run time —
      # assert instead of assuming.
      - name: Ensure npm >= 11.5.2 (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          NPMV=$(npm --version)
          echo "npm $NPMV"
          node -e "const [a,b,c]='$NPMV'.split('.').map(Number); process.exit((a>11||(a===11&&(b>5||(b===5&&c>=2))))?0:1)" \
            || { echo "::error::npm $NPMV < 11.5.2 — trusted publishing unsupported"; exit 1; }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Contracts drift gate (generated TS/zod + wire schemas in sync with php-ui mirror)
        run: npm run gen:contracts:check
      - name: Build
        run: npm run build

      # Fail before any registry is touched if the public npm copy would drift
      # from the source manifest (dropped dependencies, files or exports).
      - name: Guard public npm package manifest
        run: |
          STAGE_DIR=$(mktemp -d)
          node scripts/npm-public-package.mjs stage "$STAGE_DIR"
          node scripts/npm-public-package.mjs verify "$STAGE_DIR"

      # NOTE (first publish from this repository): the @middag-io/react package
      # on GitHub Packages is linked to the repository that first published it.
      # Before the FIRST publish from this repo succeeds, an org admin must
      # grant this repository access under the package's "Manage Actions
      # access" settings — otherwise GITHUB_TOKEN gets a 403 here.
      - name: Publish to GitHub Packages if changed
        if: steps.version.outputs.skip != 'true'
        run: |
          LOCAL_VERSION=$(node -e "console.log(require('./package.json').version)")
          GH_VERSION=$(npm view @middag-io/react version 2>/dev/null || echo "0.0.0")
          echo "Local: $LOCAL_VERSION, GitHub Packages: $GH_VERSION"
          if [ "$LOCAL_VERSION" = "$GH_VERSION" ]; then
            echo "Version $LOCAL_VERSION already on GitHub Packages, skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish compiled-only to public npm (idempotent — skips if version already exists)
      - name: Publish compiled-only to public npm
        run: |
          LOCAL_VERSION=$(node -e "console.log(require('./package.json').version)")

          # Query public npm directly (the runner .npmrc routes @middag-io to GitHub Packages)
          NPM_VERSION=$(curl -sf "https://registry.npmjs.org/@middag-io%2freact" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
              try{console.log(JSON.parse(d)['dist-tags']['latest'])}catch{console.log('0.0.0')}
            })
          ")
          echo "Local: $LOCAL_VERSION, npm: $NPM_VERSION"

          if [ "$LOCAL_VERSION" = "$NPM_VERSION" ]; then
            echo "Version $LOCAL_VERSION already on npm, skipping."
            exit 0
          fi

          echo "Publishing $LOCAL_VERSION to npm (current: $NPM_VERSION)"

          TEMP_DIR=$(mktemp -d)

          # Stage the public copy from the same `npm pack` as GitHub Packages
          # (same files, same dependencies); only publishConfig and scripts
          # are dropped (scripts/npm-public-package.mjs).
          node scripts/npm-public-package.mjs stage "$TEMP_DIR"

          # Override scoped registry to point to public npm. NO _authToken line:
          # auth comes from npm Trusted Publishing (OIDC, id-token: write above).
          # Any _authToken configured for registry.npmjs.org — even an env
          # placeholder — disables OIDC detection and sends a garbage bearer.
          echo "@middag-io:registry=https://registry.npmjs.org" > "$TEMP_DIR/.npmrc"

          # Guard: the packed public manifest must keep the source dependencies,
          # files and exports, or the publish fails here.
          node scripts/npm-public-package.mjs verify "$TEMP_DIR"

          # Publish to public npm (treat "already published" as success)
          cd "$TEMP_DIR"
          npm publish --access public 2>&1 | tee /tmp/npm-publish.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            if grep -q "cannot publish over the previously published" /tmp/npm-publish.log; then
              echo "Version $LOCAL_VERSION already on npm (race condition), skipping."
              exit 0
            fi
            exit $EXIT_CODE
          fi

  # @middag-io/ui-contracts-codegen versions on its own (release-please
  # component ui-contracts-codegen, tag ui-contracts-codegen-vX.Y.Z). Same two
  # channels as @middag-io/react: GitHub Packages and public npm through
  # Trusted Publishing.
  publish-codegen:
    name: Publish @middag-io/ui-contracts-codegen
    needs: release
    if: ${{ contains(fromJSON(needs.release.outputs.paths-released || '[]'), 'packages/contracts-codegen') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: packages/contracts-codegen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Ensure npm >= 11.5.2 (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          NPMV=$(npm --version)
          echo "npm $NPMV"
          node -e "const [a,b,c]='$NPMV'.split('.').map(Number); process.exit((a>11||(a===11&&(b>5||(b===5&&c>=2))))?0:1)" \
            || { echo "::error::npm $NPMV < 11.5.2 — trusted publishing unsupported"; exit 1; }
      - name: Skip an unreleased version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "0.0.0" ]; then
            echo "::notice::@middag-io/ui-contracts-codegen has no release yet (0.0.0); nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install (tests and pack check)
        if: steps.version.outputs.skip != 'true'
        working-directory: .
        run: npm ci
      - name: Codegen tests
        if: steps.version.outputs.skip != 'true'
        working-directory: .
        run: npx vitest run tests/contracts-codegen
      - name: Pack check
        if: steps.version.outputs.skip != 'true'
        working-directory: .
        run: npm run codegen:pack-check

      - name: Publish to GitHub Packages if changed
        if: steps.version.outputs.skip != 'true'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on GitHub Packages, skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The runner .npmrc routes @middag-io to GitHub Packages; the staged copy
      # carries its own .npmrc pointing the scope to public npm, with NO
      # _authToken (auth comes from Trusted Publishing, id-token: write above).
      # The first version of a new package has no trusted publisher yet: an
      # npm org admin publishes it once by hand and then links this workflow.
      - name: Publish to public npm if changed
        if: steps.version.outputs.skip != 'true'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if curl -sf "https://registry.npmjs.org/${NAME/\//%2f}/$VERSION" >/dev/null; then
            echo "$NAME@$VERSION already on npm, skipping."
            exit 0
          fi
          STAGE_DIR=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "$STAGE_DIR"
          cd "$STAGE_DIR"
          echo "@middag-io:registry=https://registry.npmjs.org" > .npmrc
          npm publish ./*.tgz --access public --provenance

  # @middag-io/ui-contracts versions on its own (release-please component
  # ui-contracts, tag ui-contracts-vX.Y.Z), with the version policy of its
  # README: breaking wire change -> major (minor while 0.x), additive ->
  # minor, regeneration only -> patch. Same channels as the codegen.
  publish-contracts:
    name: Publish @middag-io/ui-contracts
    needs: release
    if: ${{ contains(fromJSON(needs.release.outputs.paths-released || '[]'), 'packages/contracts') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Ensure npm >= 11.5.2 (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          NPMV=$(npm --version)
          echo "npm $NPMV"
          node -e "const [a,b,c]='$NPMV'.split('.').map(Number); process.exit((a>11||(a===11&&(b>5||(b===5&&c>=2))))?0:1)" \
            || { echo "::error::npm $NPMV < 11.5.2 — trusted publishing unsupported"; exit 1; }
      - name: Skip an unreleased version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "0.0.0" ]; then
            echo "::notice::@middag-io/ui-contracts has no release yet (0.0.0); nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install (tests and pack check)
        if: steps.version.outputs.skip != 'true'
        working-directory: .
        run: npm ci
      - name: Contracts drift gate and mirror provenance
        if: steps.version.outputs.skip != 'true'
        working-directory: .
        run: |
          npm run gen:contracts:check
          npm run contracts:verify-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and pack check
        if: steps.version.outputs.skip != 'true'
        working-directory: .
        run: |
          npm run contracts:build
          npm run contracts:pack-check

      - name: Publish to GitHub Packages if changed
        if: steps.version.outputs.skip != 'true'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on GitHub Packages, skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The runner .npmrc routes @middag-io to GitHub Packages; the staged copy
      # carries its own .npmrc pointing the scope to public npm, with NO
      # _authToken (auth comes from Trusted Publishing, id-token: write above).
      # The first version of a new package has no trusted publisher yet: an
      # npm org admin publishes it once by hand and then links this workflow.
      - name: Publish to public npm if changed
        if: steps.version.outputs.skip != 'true'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if curl -sf "https://registry.npmjs.org/${NAME/\//%2f}/$VERSION" >/dev/null; then
            echo "$NAME@$VERSION already on npm, skipping."
            exit 0
          fi
          STAGE_DIR=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "$STAGE_DIR"
          cd "$STAGE_DIR"
          echo "@middag-io:registry=https://registry.npmjs.org" > .npmrc
          npm publish ./*.tgz --access public --provenance

  # After a real publish, build the versioned docs payload and sync it
  # to Cloudflare R2. Gated on a confirmed release so it runs exactly once per
  # released version (immutability is enforced inline below).
  build-docs:
    name: Build docs payload
    needs: [release, publish]
    if: ${{ needs.release.outputs.release-created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build documentation payload (.docs-dist/)
        run: npm run docs:build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: .docs-dist
          # .docs-dist is a dot-dir; upload-artifact@v4+ excludes hidden paths by default.
          include-hidden-files: true

  # R2 publication through the
  # cloudflare-r2-docs-publish component of the public middag-io/actions
  # repository, called by its major tag. The component
  # refuses a version whose prefix already holds an object under any kind
  # (docs, xref, schemas), writes each object with a conditional PUT, never
  # deletes, and writes manifest.json (the mutable latest pointer) last.
  #
  # Repository variable (no value is written here), read by the component as
  # the default of its bucket input:
  #   CLOUDFLARE_R2_DOCS_PUBLISH_BUCKET    bucket of the public documentation packages
  # Secrets (the endpoint carries the account id; this repository's logs are
  # public):
  #   CLOUDFLARE_R2_DOCS_PUBLISH_ENDPOINT           S3 endpoint of the account (https://host)
  #   CLOUDFLARE_R2_DOCS_PUBLISH_ACCESS_KEY_ID      S3 access key with read and write on the bucket
  #   CLOUDFLARE_R2_DOCS_PUBLISH_SECRET_ACCESS_KEY  its secret
  sync-docs:
    name: Publish docs to R2
    needs: build-docs
    permissions:
      contents: read
    uses: middag-io/actions/.github/workflows/cloudflare-r2-docs-publish.yml@cloudflare-r2-docs-publish-v1
    with:
      artifact-name: docs-dist
      package-name: middag-react
    secrets:
      endpoint: ${{ secrets.CLOUDFLARE_R2_DOCS_PUBLISH_ENDPOINT }}
      access-key-id: ${{ secrets.CLOUDFLARE_R2_DOCS_PUBLISH_ACCESS_KEY_ID }}
      secret-access-key: ${{ secrets.CLOUDFLARE_R2_DOCS_PUBLISH_SECRET_ACCESS_KEY }}
